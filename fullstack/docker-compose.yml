version: "3.9"

services:

  backend:
    build: ./backend
    container_name: osint-ci-backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-claude-opus-4-7}
      - MAX_PROFILE_CHARS=${MAX_PROFILE_CHARS:-12000}
      - ALLOWED_ORIGINS=http://localhost:5173
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: osint-ci-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped
